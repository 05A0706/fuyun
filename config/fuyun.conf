# ============================================================
# fuyun 主配置 (fuyun.conf) - 内存优化 / 辅助调速器 / 核心开关 三合一
# 分区: [mem] [idle_gov] [corectl]; 修改后最多一个轮询周期生效, 重启保留
# 配套文件: whitelist.txt (白名单三合一) / mem_apps.txt (分应用回收) /
#          perapp_powermode.txt (分应用性能模式) / automation.txt (场景规则)
# WebUI 可完整可视化配置; 高级用户可直接编辑本文件
# ============================================================

[mem]
# ============================================================
#
# 配套文件:
#   mem_apps.txt    - 分应用回收策略 (包名 模式: soft/hard/kill/off)
#   mem_whitelist.txt - 回收白名单 (支持 com.xxx.* 前缀通配)
#   mem_log.txt     - 回收日志 (含每次释放的内存统计)
# ============================================================

# 总开关: 1=启用 0=停用
MEM_ENABLE=1

# 回收模式:
#   soft   = 仅通知应用释放缓存 (最温和, 兼容性最好)
#   hard   = soft + 内核级回收进程内存 (推荐)
#   kill   = 直接终止后台进程 (任务栈保留, Android 12+ 效果最佳)
# 注意: 无论哪种模式, 后台应用的"杀进程"都由下方的 IDLE_KILL_MIN 独立控制
MODE=hard

# 回收轮询间隔 (秒) —— 调大更省电
INTERVAL=300

# 内存压力阈值 (0-100): /proc/pressure/memory 的 full avg10 达到该值才回收
# 调低 = 更积极回收; 调高 = 更保守 (功耗敏感建议 30-50)
PSI_THRESHOLD=30

# hard 模式单进程最多回收量 (内核 memory.reclaim 上限)
HARD_RECLAIM=32M

# 每轮最多回收的进程数 (防止一次性回收过多导致卡顿)
MAX_PER_ROUND=10

# 空闲淘汰 (分钟): 后台应用闲置超过该时长才被杀进程 (am kill, 保留任务栈)
# 只杀: 非前台 + 闲置超时 + 非系统应用 + 非白名单 + 非 per-app off
# 设 0 = 完全关闭杀进程功能
IDLE_KILL_MIN=5

# 切换触发回收: 1=启用 0=关闭
# 前台应用切换时, 对切走的应用立即回收内存 (trim + 内核 reclaim, 不杀进程)
# 事件驱动, 每次切应用仅触发一次, 几乎无功耗代价
SWITCH_RECLAIM=1

# 推送应用包名 (| 分隔): 闲置超时后只保留含 KEEP_CMDLINE 关键词的进程, 其余清理
# 默认微信/QQ/TIM, 等同原"微信QQ优化"功能, 现支持任意应用
PUSH_KEEP=com.tencent.mm|com.tencent.mobileqq|com.tencent.tim

# 推送应用需保留的进程特征 (cmdline 关键词, | 分隔)
KEEP_CMDLINE=push|daemon|msf

# 主动压入 zram: 1=启用 0=关闭
# 对空闲后台进程尝试把匿名内存换出到 zram, 进程保活, 冷启动更快
ZRAM_RECLAIM=1

# 单进程每次尝试压入 zram 的内存量 (cgroup v2 memory.reclaim anon 回收)
ZRAM_RECLAIM_SIZE=64M

# 后台进程闲置多少分钟后开始压入 zram (沿用 last_used 判定)
ZRAM_IDLE_MIN=5

# 杀进程后是否触发系统缓存清理 (pm trim-caches)
CLEAN_CACHE_AFTER_KILL=1

# 系统缓存清理大小 (传给 pm trim-caches)
TRIM_CACHE_SIZE=512M

[idle_gov]
# ============================================================
#
# 作用: 前台应用持续低 CPU 占用时 (如停留在静态页面), 压低 uperf
#       idle 场景的功率预算, 压制空闲频率省电; 一旦恢复交互立即还原。
#       触摸瞬间 uperf 自动切 touch 场景, 交互性能不受影响。
#
# 配套文件:
#   idle_whitelist.txt - 调速器白名单 (前台命中则永不压制)
# ============================================================

# 总开关: 1=启用 0=停用
IDLE_GOV=1

# 判定轮询间隔 (秒): 前台应用 CPU 采样频率
IDLE_INTERVAL=10

# 进入深度空闲需要的前台应用持续低 CPU 时长 (秒)
IDLE_TIMEOUT=30

# 前台应用 CPU 占用阈值 (占单核百分比): 低于该值视为空闲
# 视频解码/地图渲染等持续高占用应用会自动豁免, 无需进白名单
IDLE_CPU_THD=5

# 深度空闲时 uperf idle 场景的功率预算 (瓦): 越低频率压得越狠
# 参考: 0.8 ≈ 1GHz 出头, 0.5 更激进, 1.2 保守
# 建议先保守 (0.8-1.0) 实测不卡再往下调
IDLE_POWER_W=0.8

[corectl]
# ============================================================
# (WebUI「核心开关」卡片可改)
#
# 作用: 按用户配置关闭大核/中核降低功耗, 把省电主杠杆从"压频率"改为"关核心"。
# 安全: 绝不关 cpu0; 小核簇始终在线 (因此大/中核可整簇关闭, 也不会整机无核可用)。
# ============================================================

# 总开关: 1=启用核心开关 (默认关, 请按需开启) 0=停用
CORECTL_ENABLE=0

# 息屏是否额外关核 (用户选): 1=息屏时关闭全部大核, 亮屏恢复
OFFSCREEN_OFF=0

# 辅助调速器深度空闲是否关核: 1=深度空闲联动关核(默认) 0=不联动
IDLE_OFF=1

# 常态关大核数量 (0=不关; 最大 = 大核数, 即整簇关闭)
BIG_OFF=0

# 常态关中核数量 (0=不关; 最大 = 中核数, 即整簇关闭)
MID_OFF=0

# 小核始终在线(安全约束, 保留字段): 1=是
KEEP_LITTLE=1
